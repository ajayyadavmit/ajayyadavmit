<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="120" viewBox="0 0 1000 120" role="img" aria-label="Let's build better CS and AI learning together. Get in touch." xmlns:c2pa="http://c2pa.org/manifest">
<style>
  .sans{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
  .run{stroke-dasharray:140 1900;animation:run 5s linear infinite}
